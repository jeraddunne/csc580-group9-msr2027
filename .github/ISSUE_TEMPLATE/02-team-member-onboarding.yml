name: "Team member onboarding"
description: "Join the team: share your handle, availability, strengths, and role preferences."
title: "[Onboarding] "
labels: ["onboarding", "type:process"]
body:
  - type: markdown
    attributes:
      value: |
        Fill this once. After submitting, do your first pull request: add `docs/team/<firstname>-<lastname>.md` from the template and sign `TEAM_CHARTER.md`.
        Do not put your email address or phone number here; the repository is public. Share contact details in the team channel.
  - type: input
    id: name
    attributes:
      label: Full name
    validations:
      required: true
  - type: input
    id: github
    attributes:
      label: GitHub handle
      placeholder: "@handle"
    validations:
      required: true
  - type: input
    id: pronouns
    attributes:
      label: Pronouns (optional)
  - type: input
    id: timezone
    attributes:
      label: Time zone
      placeholder: "America/Detroit"
    validations:
      required: true
  - type: dropdown
    id: hours
    attributes:
      label: Hours per week you can commit to this project
      options: ["4 to 6", "7 to 9", "10 to 12", "13 or more"]
    validations:
      required: true
  - type: textarea
    id: availability
    attributes:
      label: Availability and constraints
      description: Regular meeting slots that work, days that never work, known absences (exams, travel, work).
    validations:
      required: true
  - type: checkboxes
    id: strengths
    attributes:
      label: Strengths (check all that apply)
      options:
        - label: Python
        - label: SQL / SQLite
        - label: pandas / data wrangling
        - label: Statistics / hypothesis testing
        - label: Machine learning / classification
        - label: Text processing / NLP
        - label: Visualization
        - label: Git and GitHub workflow
        - label: Testing / CI
        - label: Academic writing / citations
        - label: Presenting / demo
        - label: Project management / facilitation
  - type: textarea
    id: learning
    attributes:
      label: What you want to learn or practice in this project
  - type: dropdown
    id: role_pref
    attributes:
      label: Preferred first Scrum role
      options:
        - No preference
        - Product Owner
        - Scrum Master
        - Developer / Researcher only for Sprint 1
  - type: dropdown
    id: os
    attributes:
      label: Primary machine
      options: ["Windows", "macOS", "Linux", "Other"]
    validations:
      required: true
  - type: checkboxes
    id: tooling
    attributes:
      label: Tooling checklist
      options:
        - label: Git installed and configured with my name
        - label: GitHub CLI installed and `gh auth login` done
        - label: Python 3.11 or newer installed
        - label: Two-factor authentication enabled on GitHub
        - label: Repository cloned outside OneDrive / iCloud sync folders
        - label: "`make test` (or `./run_pipeline.sh`) runs green locally"
  - type: textarea
    id: other
    attributes:
      label: Anything else the team should know
