name: Docs site

# Builds the readable website from the repository's Markdown (mkdocs.yml) and publishes it
# to GitHub Pages from main. Pull requests only build it, so a broken page shows up in review.
# One-time setting: Settings > Pages > Source: GitHub Actions.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "**/*.md"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the site tools
        run: pip install -r requirements-docs.txt
      - name: Build the site
        env:
          DISABLE_MKDOCS_2_WARNING: "true"
        run: mkdocs build
      - name: Upload the site for Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
