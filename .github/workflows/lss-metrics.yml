name: LSS metrics

on:
  schedule:
    - cron: "0 6 * * 0"   # Sundays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read
  actions: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then
            pip install -e ".[dev]"
          else
            pip install -r requirements.txt
          fi

      - name: Generate metrics snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/lss_metrics.py --repo ${{ github.repository }}

      - name: Open pull request with the snapshot
        uses: peter-evans/create-pull-request@v7
        with:
          branch: metrics/weekly
          delete-branch: true
          commit-message: "chore(lss): weekly metrics snapshot"
          title: "chore(lss): weekly metrics snapshot"
          labels: type:process,kaizen
          add-paths: docs/lean-six-sigma/metrics
          body: |
            Auto-generated by the `LSS metrics` workflow (`scripts/lss_metrics.py`).

            This PR refreshes `docs/lean-six-sigma/metrics/`:
            - `DASHBOARD.md` (KPIs vs targets, sprint summary, contribution balance, blockers, signals)
            - `history.csv` (one row per snapshot)
            - `snapshots/<date>.json` and `charts/*.png`

            **What to do:** the Scrum Master merges this on Monday and brings any `warn` rows and
            run-rule signals to the Thursday check-in. KPI definitions: `docs/lean-six-sigma/KPIS.md`.
            Do not edit the generated files by hand.
