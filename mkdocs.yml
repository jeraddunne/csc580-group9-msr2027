# Readable website for the repository's documents (issue #69).
# Built from the Markdown files where they already live, so every link that works on
# GitHub works on the site. Published to GitHub Pages by .github/workflows/docs-site.yml.
# Local preview: pip install -r requirements-docs.txt && mkdocs serve

site_name: Group 9 · P-01 project
site_description: Risky capabilities in copied agent skills (CSC 580 / SWE 380, MSR 2027 challenge-inspired)
site_url: https://jeraddunne.github.io/csc580-group9-msr2027/
repo_url: https://github.com/jeraddunne/csc580-group9-msr2027
repo_name: csc580-group9-msr2027
edit_uri: edit/main/

docs_dir: .
site_dir: site

plugins:
  - same-dir
  - search

exclude_docs: |
  /src/
  /tests/
  /scripts/
  /notebooks/
  /build/
  /site/
  /data/samples/
  /data/annotations/work/
  *.py
  *.ipynb
  *.bat
  *.db
  *.parquet

not_in_nav: |
  /docs/decisions/ADR-template.md
  /docs/meeting-notes/TEMPLATE-*.md
  /docs/proposals/TEMPLATE-proposal.md
  /docs/reflections/TEMPLATE-individual-reflection.md
  /docs/team/TEMPLATE-member-profile.md
  /docs/lean-six-sigma/A3_TEMPLATE.md
  /docs/lean-six-sigma/ROOT_CAUSE_TEMPLATE.md

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy
    - toc.follow
  icon:
    edit: material/pencil
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true

