# Proposed role rotation. Confirm or change at the 2026-09-16 kickoff.
roles:
  formation:    { product_owner: "Jerad Dunne",     scrum_master: "Jerad Dunne" }
  sprint-1:     { product_owner: "Jerad Dunne",     scrum_master: "Leticia Aderhold" }
  sprint-2:     { product_owner: "Allie Hodges",    scrum_master: "Hina Kramer" }
  sprint-3:     { product_owner: "Leticia Aderhold", scrum_master: "Jerad Dunne" }
  finalization: { product_owner: "Hina Kramer",     scrum_master: "Allie Hodges" }

# Semester calendar from the assignment (V2026.09.10). Sprints run Thursday to Wednesday.
timeline:
  formation:    { title: "Formation",    start: 2026-09-10, end: 2026-09-16, dmaic: "Define",  weight: 10 }
  sprint-1:     { title: "Sprint 1",     start: 2026-09-17, end: 2026-10-07, dmaic: "Measure", weight: 20 }
  sprint-2:     { title: "Sprint 2",     start: 2026-10-08, end: 2026-10-28, dmaic: "Analyze", weight: 20 }
  sprint-3:     { title: "Sprint 3",     start: 2026-10-29, end: 2026-11-18, dmaic: "Improve", weight: 25 }
  finalization: { title: "Finalization", start: 2026-11-30, end: 2026-12-04, dmaic: "Control", weight: 20 }

# Topic proposal and vote window (Formation phase).
proposals:
  proposals_due: 2026-09-14
  vote_close:    2026-09-15
  decision:      2026-09-16
  # Weighted decision matrix (Pugh-style). Weights must sum to 1.0.
  criteria:
    feasibility: { weight: 0.30, description: "Can four students implement and validate it in 9 weeks with the sample data?" }
    data_fit:    { weight: 0.20, description: "Do the dataset fields directly support the unit of analysis and outcome?" }
    rubric_fit:  { weight: 0.20, description: "Does it satisfy the required implementation component and minimum evidence?" }
    interest:    { weight: 0.15, description: "Team motivation and learning value." }
    low_risk:    { weight: 0.15, description: "Low dependency on the 41 GB full dataset, external APIs, or unclear definitions." }
  vote_method: "instant_runoff"   # winner by IRV on rankings; ties broken by weighted score, then Borda

process:
  wip_limit: 5
  estimate_scale: [1, 2, 3, 5, 8]
  standup_days: ["Mon", "Wed", "Fri"]
  checkin_day: "Thu"
  review_retro_day: "Wed"
  pr_review_sla_hours: 48
  min_reviewers: 1

metrics:
  cycle_time_days_target: 5
  lead_time_days_target: 10
  pr_first_review_hours_target: 48
  pr_merge_hours_target: 96
  commitment_reliability_target: 0.8
  first_time_right_target: 0.75
  rework_ratio_max: 0.15
  contribution_share_min: 0.15
  contribution_share_max: 0.45
  ci_pass_rate_target: 0.9
