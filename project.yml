# Single source of truth for team, timeline, and process parameters.
# Scripts (bootstrap_github.py, lss_metrics.py, tally_votes.py, workspace_digest.py) read this file.
# Change dates here if the instructor adjusts the calendar, then re-run scripts/bootstrap_github.py.
# Four-person Group 9 (docs/decisions/ADR-0006-group-reinstated.md, 2026-09-15).

course: "SWE 380 / CSC 580 Group Project"
institution: "University of Michigan-Flint"
group: 9
project_title: "Mining AI-Native Software Engineering: An MSR 2027 Challenge-Inspired Project"
repo: "jeraddunne/csc580-group9-msr2027"

instructor:
  name: "Mohamed Wiem Mkaouer"
  github: "mkaouer"
  board_template: "https://github.com/users/mkaouer/projects/5"

# Members were invited as collaborators with write access on 2026-09-15.
team:
  - name: "Leticia Aderhold"
    github: "angel06la"
  - name: "Jerad Dunne"
    github: "jeraddunne"
  - name: "Allie Hodges"
    github: "AllieHgs"
  - name: "Hina Kramer"
    github: "hinak786"

# Proposed role rotation. Confirm or change at the 2026-09-16 kickoff.
# Everyone is a Developer/Researcher in every sprint.
roles:
  formation:    { product_owner: "Jerad Dunne",      scrum_master: "Jerad Dunne" }
  sprint-1:     { product_owner: "Jerad Dunne",      scrum_master: "Leticia Aderhold" }
  sprint-2:     { product_owner: "Allie Hodges",     scrum_master: "Hina Kramer" }
  sprint-3:     { product_owner: "Leticia Aderhold", scrum_master: "Jerad Dunne" }
  finalization: { product_owner: "Hina Kramer",      scrum_master: "Allie Hodges" }

# Semester calendar from the assignment (V2026.09.10). Sprints run Thursday to Wednesday.
timeline:
  formation:    { title: "Formation",    start: 2026-09-10, end: 2026-09-16, dmaic: "Define",  weight: 10 }
  sprint-1:     { title: "Sprint 1",     start: 2026-09-17, end: 2026-10-07, dmaic: "Measure", weight: 20 }
  sprint-2:     { title: "Sprint 2",     start: 2026-10-08, end: 2026-10-28, dmaic: "Analyze", weight: 20 }
  sprint-3:     { title: "Sprint 3",     start: 2026-10-29, end: 2026-11-18, dmaic: "Improve", weight: 25 }
  finalization: { title: "Finalization", start: 2026-11-30, end: 2026-12-04, dmaic: "Control", weight: 20 }

# Topic decision (docs/decisions/ADR-0004-topic-selection.md).
topic:
  selected: "P-01"
  issue: 41
  decided: 2026-09-14
  method: "selected by Jerad Dunne; the group confirms at the 2026-09-16 kickoff (ADR-0006)"
  revisit_by: 2026-09-17   # any member may open a Decision needed issue before Sprint 1 planning
  previous_method: "ranked ballot (retired)"

# RETIRED: the ranked-ballot topic vote is not used (P-01 was selected directly).
# Kept because scripts/tally_votes.py reads proposals.criteria.
proposals:
  status: "retired"
  # Weighted decision matrix (Pugh-style). Weights must sum to 1.0.
  criteria:
    feasibility: { weight: 0.30, description: "Can four students implement and validate it in 9 weeks with the sample data?" }
    data_fit:    { weight: 0.20, description: "Do the dataset fields directly support the unit of analysis and outcome?" }
    rubric_fit:  { weight: 0.20, description: "Does it satisfy the required implementation component and minimum evidence?" }
    interest:    { weight: 0.15, description: "Team motivation and learning value." }
    low_risk:    { weight: 0.15, description: "Low dependency on the 41 GB full dataset, external APIs, or unclear definitions." }
  vote_method: "instant_runoff"   # retired; winner by IRV on rankings, ties broken by weighted score, then Borda

process:
  mode: group
  wip_limit: 5
  estimate_scale: [1, 2, 3, 5, 8]
  standup_days: ["Mon", "Wed", "Fri"]
  checkin_day: "Thu"
  review_retro_day: "Wed"
  pr_review_sla_hours: 48               # first review by a member other than the author
  min_reviewers: 1                      # main ruleset requires 1 approving review

# Validation raters (docs/validation/README.md). jd is the primary rater;
# one or more teammates label round 1 independently as second raters.
validation:
  primary_rater: jd
  rater_ids:
    jd: "Jerad Dunne"
    la: "Leticia Aderhold"
    ah: "Allie Hodges"
    hk: "Hina Kramer"

metrics:
  cycle_time_days_target: 5
  lead_time_days_target: 10
  pr_first_review_hours_target: 48
  pr_merge_hours_target: 96             # PR open-to-merge cycle time, kept as an extra KPI
  commitment_reliability_target: 0.8
  first_time_right_target: 0.75
  rework_ratio_max: 0.15
  contribution_share_min: 0.15
  contribution_share_max: 0.45
  ci_pass_rate_target: 0.9
