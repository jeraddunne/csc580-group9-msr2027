# Topic decision (docs/decisions/ADR-0004-topic-selection.md).
topic:
  selected: "P-01"
  issue: 41
  decided: 2026-09-14
  method: "sole member decision"
  previous_method: "ranked ballot (retired)"

# RETIRED (ADR-0005): the ranked-ballot topic vote is no longer used.
# Kept because scripts/tally_votes.py reads proposals.criteria.
proposals:
  status: "retired"
  # Weighted decision matrix (Pugh-style). Weights must sum to 1.0.
  criteria:
    feasibility: { weight: 0.30, description: "Can it be implemented and validated in 9 weeks with the sample data?" }
    data_fit:    { weight: 0.20, description: "Do the dataset fields directly support the unit of analysis and outcome?" }
    rubric_fit:  { weight: 0.20, description: "Does it satisfy the required implementation component and minimum evidence?" }
    interest:    { weight: 0.15, description: "Motivation and learning value." }
    low_risk:    { weight: 0.15, description: "Low dependency on the 41 GB full dataset, external APIs, or unclear definitions." }
  vote_method: "instant_runoff"   # retired; winner by IRV on rankings, ties broken by weighted score, then Borda

process:
  mode: solo
  wip_limit: 5
  estimate_scale: [1, 2, 3, 5, 8]
  standup_days: ["Mon", "Wed", "Fri"]   # solo: work-log days
  checkin_day: "Thu"
  review_retro_day: "Wed"
  pr_review_sla_hours: 48               # solo: target for PR open-to-merge cycle time
  min_reviewers: 0                      # solo: ruleset requires a PR with 0 approvals
  self_review_cooling_off_hours: 12

metrics:
  cycle_time_days_target: 5
  lead_time_days_target: 10
  pr_first_review_hours_target: 48      # solo: not applicable (no second reviewer)
  pr_merge_hours_target: 48             # solo: PR open-to-merge cycle time target (was 96 for the group)
  commitment_reliability_target: 0.8
  first_time_right_target: 0.75
  rework_ratio_max: 0.15
  contribution_share_min: 0.0           # solo: contribution balance not applicable
  contribution_share_max: 1.0           # solo: contribution balance not applicable
  ci_pass_rate_target: 0.9
