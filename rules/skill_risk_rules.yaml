  - id: R-PER-001
    category: PERSISTENCE
    severity: 7
    patterns:
      - '\bcrontab\b'
      - '~/\.(bashrc|zshrc|bash_profile|profile)\b'
      - '/etc/cron\.|/etc/rc\.local'
      - '\bsystemctl\s+enable\b'
      - '\blaunchctl\s+load\b'
      - '\.git/hooks/'
      - 'CurrentVersion\\Run\b'
    status: active
    source: expert
    examples:
      match: ["echo 'export PATH=$PATH:~/bin' >> ~/.zshrc", "systemctl enable myservice", "cp hook .git/hooks/pre-commit"]
      no_match: ["edit the project README", "git hooks are configured by husky"]
    note: "Changes that survive the session. Dotfile setup skills are a known false positive."
    title: "Persistence: startup files, schedulers, and hooks"
    description: "crontab, shell start-up files, /etc/cron or rc.local, systemctl enable, launchctl load, git hooks, or the Windows Run key. Each makes something run again after the agent's session ends, when nobody is watching."
    reference_gaps: "No ATT&CK technique for git hooks was found; that pattern is this project's addition."
    references:
      - id: "T1053.003"
        title: "Scheduled Task/Job: Cron"
        url: "https://attack.mitre.org/techniques/T1053/003/"
        kind: technique
        relation: "Persistence through crontab entries"
      - id: "T1546.004"
        title: "Event Triggered Execution: Unix Shell Configuration Modification"
        url: "https://attack.mitre.org/techniques/T1546/004/"
        kind: technique
        relation: "Commands added to ~/.bashrc, ~/.zshrc, or ~/.profile"
      - id: "T1543.002"
        title: "Create or Modify System Process: Systemd Service"
        url: "https://attack.mitre.org/techniques/T1543/002/"
        kind: technique
        relation: "Persistence through systemd units"
      - id: "T1543.001"
        title: "Create or Modify System Process: Launch Agent"
        url: "https://attack.mitre.org/techniques/T1543/001/"
        kind: technique
        relation: "Persistence through LaunchAgent plists loaded with launchctl"
      - id: "T1547.001"
        title: "Boot or Logon Autostart Execution: Registry Run Keys / Startup Folder"
        url: "https://attack.mitre.org/techniques/T1547/001/"
        kind: technique
        relation: "Persistence through the CurrentVersion\\Run registry keys"

  - id: R-OBF-001
    category: OBFUSCATION
    severity: 7
    patterns:
      - '\bbase64\s+(-d|-D|--decode)\b'
      - '\bFromBase64String\b'
      - '(\\x[0-9a-fA-F]{2}){8,}'
    status: active
    source: expert
    examples:
      match: ["echo aGVsbG8= | base64 -d | sh", "[Convert]::FromBase64String($s)"]
      no_match: ["encode the image as base64 for the API"]
    note: "Decoding of encoded payloads. Image and certificate handling are known false positives."
    title: "Decoding an encoded payload"
    description: "base64 -d, FromBase64String, or a long run of hex escapes. Encoding hides what will run from anyone reading the skill, and decoding just before use is a common way to deliver a hidden command."
    references:
      - id: "T1027"
        title: "Obfuscated Files or Information"
        url: "https://attack.mitre.org/techniques/T1027/"
        kind: technique
        relation: "Encoding or obfuscating payloads to hide them from analysis"
      - id: "T1140"
        title: "Deobfuscate/Decode Files or Information"
        url: "https://attack.mitre.org/techniques/T1140/"
        kind: technique
        relation: "Decoding payloads before use; procedure examples name FromBase64String"
